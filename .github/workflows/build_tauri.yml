name: Build & Release MunAutomation (macOS, Windows, Linux)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS Apple Silicon & Intel
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest' # Windows x64
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04' # Linux x64
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'MunAutomationRust/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies & Build Vite
        working-directory: MunAutomationRust
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked || true

      - name: Build Tauri Binary
        working-directory: MunAutomationRust
        run: |
          cargo tauri build --target ${{ matrix.target }}

      - name: Create Release Packages
        id: package
        shell: bash
        run: |
          mkdir -p release_out
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            find MunAutomationRust/src-tauri/target -name "*.dmg" -exec cp {} release_out/ \; 2>/dev/null || true
            find MunAutomationRust/src-tauri/target -name "*.app" -exec tar -czvf release_out/MunAutomation-macOS.tar.gz -C $(dirname {}) $(basename {}) \; 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            find MunAutomationRust/src-tauri/target -name "*.exe" -exec cp {} release_out/ \; 2>/dev/null || true
            find MunAutomationRust/src-tauri/target -name "*.msi" -exec cp {} release_out/ \; 2>/dev/null || true
          else
            find MunAutomationRust/src-tauri/target -name "*.deb" -exec cp {} release_out/ \; 2>/dev/null || true
            find MunAutomationRust/src-tauri/target -name "*.AppImage" -exec cp {} release_out/ \; 2>/dev/null || true
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MunAutomation-${{ matrix.platform }}
          path: release_out/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "MunAutomation Latest Release"
          body: "Bản build tự động mới nhất của Mun TikTok Farm (Rust Tauri v2) cho macOS, Windows và Linux."
          draft: false
          prerelease: false
          files: release_out/*

