name: Build Custom Anti-Detect Chromium Core
run-name: Build Custom Anti-Detect Chromium (${{ github.ref_name }})

on:
  push:
    branches: [ main ]
    tags:
      - 'chr-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v128.0.0-qhtd)'
        required: true
        default: 'v128.0.0-qhtd'

jobs:
  build-chromium-windows:
    name: Build Chromium Windows x64
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Maximize Runner Disk Space
        shell: powershell
        run: |
          Write-Host "Free disk space before cleanup:"
          Get-PSDrive C | Select-Object Used,Free
          # Remove Android, Java, .NET SDKs to free up ~30GB
          Remove-Item -Recurse -Force "C:\ProgramData\Microsoft\AndroidNDK" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby*" -ErrorAction SilentlyContinue
          Write-Host "Free disk space after cleanup:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Checkout QHTD Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Depot Tools
        shell: powershell
        run: |
          Write-Host "Downloading Google Depot Tools..."
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-infra/depot_tools.zip" -OutFile "depot_tools.zip"
          Expand-Archive -Path "depot_tools.zip" -DestinationPath "$env:USERPROFILE\depot_tools"
          $depotPath = "$env:USERPROFILE\depot_tools"
          [Environment]::SetEnvironmentVariable("PATH", "$depotPath;" + $env:PATH, [EnvironmentVariableTarget]::Process)
          [Environment]::SetEnvironmentVariable("DEPOT_TOOLS_WIN_TOOLCHAIN", "0", [EnvironmentVariableTarget]::Process)
          Add-Content $env:GITHUB_PATH "$depotPath"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_WIN_TOOLCHAIN=0"

      - name: Fetch Chromium Source Tree (Shallow)
        shell: cmd
        run: |
          git config --global http.postBuffer 1048576000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          mkdir chromium_build
          cd chromium_build
          call fetch.bat --no-history --nohooks chromium || (timeout /t 10 && call fetch.bat --no-history --nohooks chromium)
          cd src
          git fetch --depth 1 origin tag 128.0.6613.119
          git checkout -B build_qhtd tags/128.0.6613.119
          call gclient sync -D --force --no-history || (timeout /t 15 && call gclient sync -D --force --no-history)

      - name: Apply QHTD Anti-Detect C++ Patches
        shell: cmd
        run: |
          cd chromium_build\src
          python ..\..\chromium-patches\apply_patches.py .

      - name: Clean Runner Windows SDK Environment Variables
        shell: cmd
        run: |
          python chromium-patches\clean_env.py

      - name: Generate Build Configuration (GN args)
        shell: cmd
        run: |
          cd chromium_build\src
          python ..\..\chromium-patches\clean_env.py
          python ..\..\chromium-patches\generate_args.py
          call gn.bat gen out\Release

      - name: Compile Chromium Core with Ninja
        shell: cmd
        run: |
          cd chromium_build\src
          python ..\..\chromium-patches\clean_env.py
          python ..\..\chromium-patches\generate_args.py
          call ninja.bat -C out\Release chrome

      - name: Print Ninja Error Log on Failure
        if: failure()
        shell: powershell
        run: |
          cd chromium_build\src
          Write-Host "================== COMPILATION FAILED =================="
          if (Test-Path "out\Release\chrome.exe") {
            Write-Host "chrome.exe EXISTS!"
          } else {
            Write-Host "chrome.exe NOT FOUND!"
          }
          if (Test-Path "out\Release\.ninja_log") {
            Write-Host "--- Last 60 lines of .ninja_log ---"
            Get-Content "out\Release\.ninja_log" -Tail 60
          }
          # Also search for any .log or compile error files
          Get-ChildItem -Path "out\Release" -Filter "*.log" -Recurse | ForEach-Object {
            Write-Host "Log file found: $($_.FullName)"
            Get-Content $_.FullName -Tail 50
          }
          Write-Host "======================================================="

      - name: Package Portable Chromium
        if: always()
        shell: powershell
        run: |
          if (Test-Path "chromium_build\src\ninja_build.log") {
            Copy-Item "chromium_build\src\ninja_build.log" "ninja_build.log"
          }
          $outDir = "chromium_build\src\out\Release"
          if (Test-Path "$outDir\chrome.exe") {
            $packDir = "qhtd-browser-portable"
            New-Item -ItemType Directory -Path $packDir
            Copy-Item "$outDir\chrome.exe" "$packDir\qhtd-browser.exe"
            Copy-Item "$outDir\*.dll" "$packDir\"
            Copy-Item "$outDir\*.pak" "$packDir\"
            Copy-Item "$outDir\icudtl.dat" "$packDir\"
            Copy-Item "$outDir\v8_context_snapshot.bin" "$packDir\"
            if (Test-Path "$outDir\locales") { Copy-Item "$outDir\locales" "$packDir\" -Recurse }
            Compress-Archive -Path "$packDir\*" -DestinationPath "qhtd-browser-windows-x64.zip"
            Write-Host "SUCCESS: Packaged qhtd-browser-windows-x64.zip successfully!"
          } else {
            Write-Host "WARNING: chrome.exe not found in $outDir yet."
          }

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qhtd-browser-windows-x64
          path: |
            qhtd-browser-windows-x64.zip
            ninja_build.log
            chromium_build/src/out/Release/.ninja_log

      - name: Create GitHub Release & Upload Artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'chr-v128.0.0' }}
          name: "QHTD Anti-Detect Chromium Core ${{ github.ref_name || github.event.inputs.release_tag || 'v128.0.0' }}"
          files: qhtd-browser-windows-x64.zip
          draft: false
          prerelease: false
